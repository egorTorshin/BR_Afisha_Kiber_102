x-app-security: &app-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m

services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afisha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-afisha_db}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afisha_user} -d ${POSTGRES_DB:-afisha_db}"]
      interval: 3s
      timeout: 3s
      retries: 15

  prepare:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.bootstrap", "prepare", "--seed-demo"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-afisha_user}@db:5432/${POSTGRES_DB:-afisha_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:?Set BOT_DB_PASSWORD in .env}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Set MAINTENANCE_DB_PASSWORD in .env}

  api:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://afisha_api@db:5432/${POSTGRES_DB:-afisha_db}
      PGPASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAX_BOT_ENABLED: ${MAX_BOT_ENABLED:-false}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      MODERATOR_USERNAME: ${MODERATOR_USERNAME:-}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-}
      MODERATOR_PASSWORD_HASH: ${MODERATOR_PASSWORD_HASH:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_CACHE_MAX_AGE: ${PUBLIC_CACHE_MAX_AGE:-60}
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-2097152}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REFERENCE_DATE: ${REFERENCE_DATE:-}
      # AI is opt-in. The base stack always starts in deterministic offline mode.
      AI_MODE: ${AI_MODE:-no-ai}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-qwen2.5-1.5b-router}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-5}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.7}
      REDIS_URL: ${REDIS_URL:-}
      JEV_CACHE_TTL_SECONDS: ${JEV_CACHE_TTL_SECONDS:-300}
      JEV_PROMPT_VERSION: ${JEV_PROMPT_VERSION:-v1}
      CATALOG_CACHE_VERSION: ${CATALOG_CACHE_VERSION:-v1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-qwen2.5-3b-local}
      LIGHT_LLM_CONFIDENCE_THRESHOLD: ${LIGHT_LLM_CONFIDENCE_THRESHOLD:-0.75}
      LIGHT_LLM_TIMEOUT_SECONDS: ${LIGHT_LLM_TIMEOUT_SECONDS:-25}
      LIGHT_LLM_MAX_TOKENS: ${LIGHT_LLM_MAX_TOKENS:-384}
      HEAVY_LLM_MODEL: ${HEAVY_LLM_MODEL:-qwen2.5-3b-local}
      HEAVY_LLM_TIMEOUT_SECONDS: ${HEAVY_LLM_TIMEOUT_SECONDS:-90}
      HEAVY_LLM_MAX_TOKENS: ${HEAVY_LLM_MAX_TOKENS:-512}
      HEAVY_LLM_CONTEXT_WINDOW: ${HEAVY_LLM_CONTEXT_WINDOW:-4096}
      HEAVY_LLM_TOP_N: ${HEAVY_LLM_TOP_N:-8}
      AGENT_DIALOGUE_TTL_DAYS: ${AGENT_DIALOGUE_TTL_DAYS:-30}
      AGENT_MODEL_PRICES_JSON: '${AGENT_MODEL_PRICES_JSON:-{}}'

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s

  frontend:
    <<: *app-security
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      NODE_ENV: production
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /app/.next/cache:rw,nosuid,nodev,size=64m
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  bot:
    <<: *app-security
    build: .
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://afisha_bot@db:5432/${POSTGRES_DB:-afisha_db}
      PGPASSWORD: ${BOT_DB_PASSWORD:?Set BOT_DB_PASSWORD in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAX_BOT_ENABLED: ${MAX_BOT_ENABLED:-false}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      SUBSCRIPTION_RETENTION_DAYS: ${SUBSCRIPTION_RETENTION_DAYS:-180}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REFERENCE_DATE: ${REFERENCE_DATE:-}
      AI_MODE: ${AI_MODE:-no-ai}
      JEV_ENABLED: ${JEV_ENABLED:-false}
      JEV_ENDPOINT: ${JEV_ENDPOINT:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-qwen2.5-1.5b-router}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-5}
      JEV_CONFIDENCE_THRESHOLD: ${JEV_CONFIDENCE_THRESHOLD:-0.7}
      REDIS_URL: ${REDIS_URL:-}
      JEV_CACHE_TTL_SECONDS: ${JEV_CACHE_TTL_SECONDS:-300}
      JEV_PROMPT_VERSION: ${JEV_PROMPT_VERSION:-v1}
      CATALOG_CACHE_VERSION: ${CATALOG_CACHE_VERSION:-v1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LIGHT_LLM_MODEL: ${LIGHT_LLM_MODEL:-qwen2.5-3b-local}
      LIGHT_LLM_CONFIDENCE_THRESHOLD: ${LIGHT_LLM_CONFIDENCE_THRESHOLD:-0.75}
      LIGHT_LLM_TIMEOUT_SECONDS: ${LIGHT_LLM_TIMEOUT_SECONDS:-25}
      LIGHT_LLM_MAX_TOKENS: ${LIGHT_LLM_MAX_TOKENS:-384}
      HEAVY_LLM_MODEL: ${HEAVY_LLM_MODEL:-qwen2.5-3b-local}
      HEAVY_LLM_TIMEOUT_SECONDS: ${HEAVY_LLM_TIMEOUT_SECONDS:-90}
      HEAVY_LLM_MAX_TOKENS: ${HEAVY_LLM_MAX_TOKENS:-512}
      HEAVY_LLM_CONTEXT_WINDOW: ${HEAVY_LLM_CONTEXT_WINDOW:-4096}
      HEAVY_LLM_TOP_N: ${HEAVY_LLM_TOP_N:-8}
      AGENT_DIALOGUE_TTL_DAYS: ${AGENT_DIALOGUE_TTL_DAYS:-30}
      AGENT_MODEL_PRICES_JSON: '${AGENT_MODEL_PRICES_JSON:-{}}'
    ports:
      - "127.0.0.1:${MAX_WEBHOOK_PORT:-18081}:8081"

  maintenance:
    <<: *app-security
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.bootstrap", "prune", "--loop"]
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://afisha_maintenance@db:5432/${POSTGRES_DB:-afisha_db}
      PGPASSWORD: ${MAINTENANCE_DB_PASSWORD:?Set MAINTENANCE_DB_PASSWORD in .env}
      SUBSCRIPTION_RETENTION_DAYS: ${SUBSCRIPTION_RETENTION_DAYS:-180}
      FEEDBACK_RETENTION_DAYS: ${FEEDBACK_RETENTION_DAYS:-365}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-365}
      IMPORT_REPORT_RETENTION_DAYS: ${IMPORT_REPORT_RETENTION_DAYS:-365}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
